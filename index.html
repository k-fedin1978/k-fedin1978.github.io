<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://widget.cloudpayments.ru/bundles/cloudpayments.js"></script>
</head>

<body>
    <script>
        (function pay() {
            var widget = new cp.CloudPayments();

            var intentParams = {
                publicTerminalId: "pk_305db2f56ee1392ea43aa62568664",
                amount: 120,
                currency: "RUB",
                paymentSchema: 'Single',
                saveCard: false,
                // userInfo: {
                //     accountId: "test170426"
                // },
                // recurrent: {
                //     period: 1,
                //     interval: 'Month'
                // }

            }

            widget.start(intentParams).then(function (widgetResult) {
                const isFail = ['error', 'cancel'].includes(widgetResult.type) || ['cancel', 'reject', 'fail'].includes(widgetResult.status);
                if (isFail) {
                    window.location.href = 'https://developers.cloudpayments.ru/#svodka-izmeneniy';
                } else {
                    window.location.href = 'https://cloudpayments.ru/';
                }
            });
        })();
    </script>
</body>
</html>
